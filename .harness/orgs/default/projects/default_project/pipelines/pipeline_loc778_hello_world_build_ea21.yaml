pipeline:
  id: pipeline_loc778_hello_world_build_ea21
  name: pipeline_loc778_hello_world_build_ea21
  stages:
    - id: build
      name: Build
      clone:
        enabled: true
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      cache:
        enabled: true
      steps:
        - name: Verify Python Script
          id: verify_script
          run:
            shell: bash
            script: "echo \"=== Operating system ===\"\r

              uname -a\r

              \r

              echo \"=== Available Python commands ===\"\r

              command -v python3 || true\r

              command -v python || true\r

              command -v py || true\r

              \r

              echo \"=== Python version checks ===\"\r

              python3 --version"
        - name: Verify Existing EXE
          run:
            shell: bash
            script: "echo \"=== Checking executable ===\"\r

              \r

              if [ ! -f hello.exe ]; then\r

              \    echo \"ERROR: hello.exe not found\"\r

              \    exit 1\r

              fi\r

              \r

              if [ ! -s hello.exe ]; then\r

              \    echo \"ERROR: hello.exe is empty\"\r

              \    exit 1\r

              fi\r

              \r

              echo \"SUCCESS: hello.exe exists and is not empty.\""
          id: Verify_Existing_EXE
  tags:
    onboarding: "true"
