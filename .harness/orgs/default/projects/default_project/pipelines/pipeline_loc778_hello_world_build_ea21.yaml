pipeline:
  id: pipeline_loc778_hello_world_build_ea21
  name: pipeline_loc778_hello_world_build_ea21
  stages:
    - id: build
      name: Build
      clone:
        enabled: true
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      cache:
        enabled: true
      steps:
        - name: Verify Python Script
          id: verify_script
          run:
            shell: bash
            script: "echo \"=== Python version ===\"\r

              python3 --version || exit 1\r

              \r

              echo \"=== Checking Python syntax ===\"\r

              python3 -m py_compile hello.py || exit 1\r

              \r

              echo \"=== Running application ===\"\r

              python3 hello.py > output.txt 2>&1\r

              result=$?\r

              \r

              cat output.txt\r

              \r

              if [ \"$result\" -ne 0 ]; then\r

              \    echo \"ERROR: Python application failed\"\r

              \    exit 1\r

              fi\r

              \r

              echo \"=== Checking expected greeting ===\"\r

              if ! grep -Fq \"hello world\" output.txt; then\r

              \    echo \"ERROR: Expected greeting not found\"\r

              \    exit 1\r

              fi\r

              \r

              echo \"=== Python validation passed ===\""
        - name: Verify Existing EXE
          run:
            shell: bash
            script: "echo \"=== Checking executable ===\"\r

              \r

              if [ ! -f hello.exe ]; then\r

              \    echo \"ERROR: hello.exe not found\"\r

              \    exit 1\r

              fi\r

              \r

              if [ ! -s hello.exe ]; then\r

              \    echo \"ERROR: hello.exe is empty\"\r

              \    exit 1\r

              fi\r

              \r

              echo \"SUCCESS: hello.exe exists and is not empty.\""
          id: Verify_Existing_EXE
  tags:
    onboarding: "true"
